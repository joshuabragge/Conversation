name: Conversation
options:
  bundleIdPrefix: com.joshuabragge
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    from: "0.9.0"
  # On-device LLM runtime for the (feature-flagged, off by default) local
  # speaking-feedback coach — see FeedbackConfig.isEnabled and
  # Conversation/Feedback/. Apple's own native Swift ML stack (Metal-
  # accelerated), the natural fit for a pure Swift/SwiftUI app versus
  # binding llama.cpp's C++ library directly. Requires a physical Apple
  # Silicon device — no simulator support, same class of constraint as the
  # rest of the device-dependent pipeline (STT/TTS/Bluetooth).
  MLXSwiftLM:
    url: https://github.com/ml-explore/mlx-swift-lm
    from: "3.31.4"
  # MLXLMCommon deliberately doesn't bundle a tokenizer implementation —
  # `TokenizerLoader` is an app-supplied bridge protocol instead (see
  # Conversation/Feedback/FeedbackModelManager.swift). swift-transformers'
  # `Tokenizers` module is already resolved transitively via WhisperKit,
  # but a target can only `import` a product it directly depends on, so it
  # needs its own explicit package/product entry here too.
  SwiftTransformers:
    url: https://github.com/huggingface/swift-transformers
    from: "1.1.9"

targets:
  Conversation:
    type: application
    platform: iOS
    sources:
      - path: Conversation
        excludes:
          - "Resources/WhisperModels/openai_whisper-tiny/**"
          - "Resources/LLMModels/gemma-3-270m-it-4bit/**"
      # Added as a separate folder reference (not a group) so Xcode copies
      # it into the app bundle as one intact directory tree instead of
      # flattening every .mlmodelc's internal files (coremldata.bin,
      # model.mil, ...) into colliding top-level resources — WhisperKit
      # expects a real nested folder structure at load time. Bundling the
      # tiny model directly means language-ID needs no network even on a
      # brand new install; see CLAUDE.md/README.md for why only tiny (not
      # base) is bundled, and WhisperModelManager.bundledFolder for the
      # runtime side of this.
      - path: Conversation/Resources/WhisperModels/openai_whisper-tiny
        type: folder
        buildPhase: resources
      # Same reasoning as the WhisperKit tiny model above: MLX loads a
      # model from a real on-disk directory, so this needs to survive as
      # one intact folder rather than a flattened group. Bundled
      # *temporarily* to speed up POC iteration on the feature-flagged
      # (off by default) local feedback coach — see FeedbackConfig and
      # CLAUDE.md's "AI feedback coach" section for the plan to revisit
      # this as a WhisperModelManager-style optional download if it
      # sticks.
      - path: Conversation/Resources/LLMModels/gemma-3-270m-it-4bit
        type: folder
        buildPhase: resources
    dependencies:
      - package: WhisperKit
        product: WhisperKit
      - package: MLXSwiftLM
        product: MLXLLM
      - package: MLXSwiftLM
        product: MLXLMCommon
      - package: SwiftTransformers
        product: Tokenizers
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshuabragge.Conversation
        INFOPLIST_FILE: Conversation/Resources/Info.plist
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
    info:
      path: Conversation/Resources/Info.plist
      properties:
        NSMicrophoneUsageDescription: "Conversation listens through your headphones' mic to hear what you say and translate it."
        # Deliberately doesn't promise on-device unconditionally: it's the
        # default and what happens unless the user turns on "Allow Apple's
        # servers" in Settings (see RecognitionConfig.allowServerBasedRecognition),
        # which exists because some locales have no usable offline
        # dictation model. Claiming speech never leaves the device would be
        # inaccurate for anyone who needs that setting.
        NSSpeechRecognitionUsageDescription: "Conversation transcribes your speech to translate it between your two chosen languages. This happens on-device by default; you can optionally allow Apple's servers in Settings if a language has no offline dictation model."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Deliberately NOT declaring UIBackgroundModes: [audio] — this app
        # used to, to keep listening/translating with the screen locked, but
        # AVSpeechSynthesizer producing no audio while backgrounded turned
        # out to be a long-standing, unresolved Apple platform bug (see
        # CLAUDE.md), not something fixable here. Rather than keep the mic
        # running in the background for a pipeline that can't speak the
        # result back, the app is foreground-only by design now: it disables
        # the idle timer while a session is running instead (see
        # ConversationLoopController), so the screen just doesn't
        # auto-lock, and pauses gracefully (via the existing audio
        # interruption handling) if it's backgrounded anyway. Don't add this
        # back reflexively just because "walking app" sounds like it needs
        # it — it doesn't fix the actual problem.

  ConversationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ConversationTests
    dependencies:
      - target: Conversation
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.joshuabragge.ConversationTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Conversation:
    build:
      targets:
        Conversation: all
        ConversationTests: [test]
    test:
      targets:
        - ConversationTests
    run:
      config: Debug
